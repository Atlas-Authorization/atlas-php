name: CI
on:
  push:
jobs:
  drupal:
    # The Drupal module (integrations/drupal) over this SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sodium
      - run: composer config repositories.drupal composer https://packages.drupal.org/8
        working-directory: integrations/drupal
      - run: composer install --no-interaction --prefer-dist --no-plugins
        working-directory: integrations/drupal
      - run: vendor/bin/phpunit
        working-directory: integrations/drupal